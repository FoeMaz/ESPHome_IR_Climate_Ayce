# Board: M5Stack ATOM Lite (M5Stack)
# Definition: definitions/boards/m5stack-atom-lite/manifest.yaml

esphome:
  name: ir-proxy
  friendly_name: IR Proxy

esp32:
  variant: esp32
  flash_size: 4MB
  framework:
    type: esp-idf

external_components:
  - source: my_components
    components: [ayce]

logger:
  level: DEBUG

api:
  encryption:
    key: 

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

remote_transmitter:
  - pin: GPIO12
    carrier_duty_percent: 50%
    id: remote_transmitter_atom
    
infrared:
  - platform: ir_rf_proxy
    remote_transmitter_id: remote_transmitter_atom
    name: IR Transmitter Atom

climate:
  - platform: ayce
    name: Klima
    transmitter_id: remote_transmitter_atom

